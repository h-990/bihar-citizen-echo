<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Squircle Frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Concentric Acoustic Pulse Rings -->
  <circle cx="64" cy="62" r="46" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.35" stroke-dasharray="4,3"/>
  <circle cx="64" cy="62" r="36" fill="none" stroke="#f59e0b" stroke-width="1.4" opacity="0.45"/>
  <circle cx="64" cy="62" r="26" fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.6"/>

  <!-- Left Shield Half (Electric Cyan) -->
  <path d="M64 26 C53 26 40 33 40 46 C40 68 56 82 64 94 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Shield Half (Golden Amber) -->
  <path d="M64 26 C75 26 88 33 88 46 C88 68 72 82 64 94 Z" 
        fill="none" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Central Spine -->
  <line x1="64" y1="28" x2="64" y2="92" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- Circuit Branches (Left - Cyan) -->
  <path d="M64 42 H52 V48 H48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="2" fill="#38bdf8"/>
  <path d="M64 56 H50 V64 H46" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="64" r="2" fill="#38bdf8"/>
  <path d="M64 70 H54 V76 H52" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="76" r="1.8" fill="#38bdf8"/>

  <!-- Circuit Branches (Right - Amber) -->
  <path d="M64 42 H76 V48 H80" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="80" cy="48" r="2" fill="#fbbf24"/>
  <path d="M64 56 H78 V64 H82" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="82" cy="64" r="2" fill="#fbbf24"/>
  <path d="M64 70 H74 V76 H76" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="76" cy="76" r="1.8" fill="#fbbf24"/>

  <!-- Top Crown Jewel -->
  <circle cx="64" cy="27" r="2.8" fill="#ffffff" filter="url(#glow)"/>
</svg>