name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript Syntax
        run: |
          node -c backend/static/js/app.js
          node -c backend/static/js/modal.js
          node -c backend/static/js/terminal.js
          node -c backend/static/js/canvas_nodes.js
          node -c extensions/bihar_news_scraper/background.js
          node -c extensions/bihar_news_scraper/content.js
          node -c extensions/deepseek_automator/content_script.js
          node -c extensions/civic_severity_scorer/background.js

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests -v
